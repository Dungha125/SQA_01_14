[pytest]
minversion = 8.0
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    -v
    --tb=short
    --strict-markers
markers =
    rooms: Room management tests (PH-01 to PH-93)
    semesters: Semester management tests (HK-01 to HK-66)
    scheduling: Scheduling tests (LL-01 to LL-134)
    ctdt: Training program management tests (CTDT-01 to CTDT-73)
    users: User management tests (QLND-01 to QLND-41)
    tkb: Timetable management tests (TKB-01 to TKB-75)
    hvk: Post-validation tests (HVK-01 to HVK-84)
    ui: UI/UX tests
    functional: Functional tests
    negative: Negative/invalid input tests
    e2e: End-to-end tests
    slow: Slow-running tests
    db_write: Tests that modify database (require rollback)
    skip_auth: Tests that skip authentication
