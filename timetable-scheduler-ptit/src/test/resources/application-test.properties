# ============================================
# Config cho môi trường TEST (dùng H2 in-memory)
# Tránh cần kết nối MySQL thật và Redis thật
# ============================================

# H2 In-Memory Database thay thế MySQL
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Tắt Redis (dùng mock/no-op)
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration,org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration

# JWT secret (fake cho test)
jwt.secret=testSecretKeyForJacocoTestingPurposesOnly1234567890
jwt.expiration=86400000

# Tắt DataLoader tự động
spring.sql.init.mode=never

# Log level thấp cho test
logging.level.root=WARN
logging.level.com.ptit=ERROR
